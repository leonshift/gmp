<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="376" viewBox="0 0 1120 376" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GMP 系统架构</title>
  <desc id="desc">主机通过 1GbE 连接 FPGA。RV32 控制核、矩阵单元、向量单元、256 KiB 片上缓冲与 DMA 连接片内总线，外部双通道 DRAM 直接连接该总线。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 1L5 4L2 7" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #334155; }
    .module { font-size: 17px; font-weight: 500; text-anchor: middle; }
    .detail { font-size: 12px; fill: #64748b; }
  </style>
  <rect width="1120" height="376" fill="#ffffff"/>

  <!-- Host interface -->
  <rect x="24" y="124" width="168" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="108" y="174" text-anchor="middle" font-size="20" font-weight="500">主机</text>
  <text x="108" y="204" text-anchor="middle" class="detail">Python runtime</text>
  <path d="M192 168H288" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M288 212H192" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="154" text-anchor="middle" class="detail">prompt</text>
  <text x="240" y="194" text-anchor="middle" class="detail">1GbE</text>
  <text x="240" y="236" text-anchor="middle" class="detail">tokens</text>

  <!-- On-chip computation and memory subsystem -->
  <rect x="288" y="24" width="536" height="328" rx="10" fill="#f8fafc" stroke="#dbe3ec"/>
  <text x="312" y="66" font-size="21" font-weight="600">GMP SoC</text>
  <text x="800" y="66" text-anchor="end" font-size="13" fill="#64748b">Kintex-7 · 150 MHz</text>
  <rect x="312" y="100" width="152" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="388" y="143" class="module">RV32 控制核</text>
  <rect x="480" y="100" width="152" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="556" y="143" class="module">2D 矩阵单元</text>
  <rect x="648" y="100" width="152" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="724" y="143" class="module">1D 向量单元</text>
  <path d="M388 172V200H724V172M556 172V200M428 200V228M684 200V228" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="312" y="228" width="232" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="428" y="267" class="module">L1 片上缓冲</text>
  <text x="428" y="295" text-anchor="middle" class="detail">256 KiB · 编译期分配</text>
  <rect x="568" y="228" width="232" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="684" y="267" class="module">DMA 与片上互联</text>
  <text x="684" y="295" text-anchor="middle" class="detail">权重与中间结果传输</text>

  <!-- External memory -->
  <line x1="724" y1="200" x2="920" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="920" y="100" width="176" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="944" y="134" font-size="20" font-weight="500">DRAM</text>
  <text x="944" y="157" class="detail">双通道内存</text>
  <path d="M944 172H1072" stroke="#e2e8f0"/>
  <text x="944" y="200" font-size="14">权重 · 762 MiB</text>
  <text x="944" y="231" font-size="14">KV cache</text>
  <text x="944" y="262" font-size="14">程序 · 52 KB</text>
</svg>
